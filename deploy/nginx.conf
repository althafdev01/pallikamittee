# /etc/nginx/sites-available/pallikamitti
# Symlink to sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/pallikamitti /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name vvjmpallicommitte.online www.vvjmpallicommitte.online;

    # Redirect all plain HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vvjmpallicommitte.online www.vvjmpallicommitte.online;

    # --- TLS (Let's Encrypt fills these in after running certbot) ----------
    ssl_certificate     /etc/letsencrypt/live/vvjmpallicommitte.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vvjmpallicommitte.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    # -----------------------------------------------------------------------

    # WhiteNoise handles static files inside Django/gunicorn, so nginx only
    # needs to proxy all requests straight through.
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 10M;
}
